code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
pre{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow:auto;margin:8px 0}
.tag{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;color:var(--dim)}

<script>
const D=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S=D.stats;document.getElementById('meta').textContent=`${D.root} · ${S.files_scanned} files · ${S.lines_scanned.toLocaleString()} lines · ${Object.keys(S.languages).slice(0,6).join(', ')}`;
const live=D.findings.filter(f=>f.verdict!=='false_positive');
const cnt=k=>live.filter(f=>f.severity===k).length;
/* slopguard: ignore[SEC017] every interpolated value goes through esc() */
document.getElementById('cards').innerHTML=`<div class="card"><span class="dim">Health</span><b class="grade">${D.grade}</b>${D.score}/100</div>`+
['critical','high','medium','low'].map(k=>`<div class="card"><span class="dim">${k}</span><b>${cnt(k)}</b></div>`).join('')+
`<div class="card"><span class="dim">AI-dismissed</span><b>${D.findings.length-live.length}</b></div>`;
/* slopguard: ignore[SEC017] every interpolated value goes through esc() */
if(D.ai_summary){document.getElementById('ai').innerHTML=`<h3>AI triage summary</h3><div class="summary">${esc(D.ai_summary)}</div>`}
const fill=(id,vals)=>{const el=document.getElementById(id);vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)})};
fill('cat',[...new Set(D.findings.map(f=>f.category))]);fill('sev',['critical','high','medium','low','info']);
const verdictTag=f=>f.verdict==='confirmed'?`<span class="tag ai">${f.source==='ai'?'AI found':'AI confirmed'}</span>`:
f.verdict==='false_positive'?'<span class="tag">AI dismissed</span>':f.verdict==='needs_review'?'<span class="tag">needs review</span>':'';
function draw(){const q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value,
s=document.getElementById('sev').value,v=document.getElementById('ver').value;
const rows=D.findings.filter(f=>(!c||f.category===c)&&(!s||f.severity===s)&&(!v||(v==='live'?f.verdict!=='false_positive':f.verdict===v))&&
(!q||JSON.stringify(f).toLowerCase().includes(q)));
document.getElementById('count').textContent=`${rows.length} of ${D.findings.length} findings`;
/* slopguard: ignore[SEC017] every interpolated value goes through esc() */
document.getElementById('list').innerHTML=rows.map(f=>`<div class="f ${f.severity}"><span class="sev">${f.severity}</span>
<b> ${esc(f.rule_id)}</b> ${esc(f.title)} ${verdictTag(f)}<span class="tag">${esc(f.category)}</span>
<div class="dim"><code>${esc(f.path||'<repository>')}${f.line?':'+f.line:''}</code></div>
